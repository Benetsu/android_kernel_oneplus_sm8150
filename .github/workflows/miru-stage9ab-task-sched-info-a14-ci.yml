name: Miru H.40 Wave 31 ION boost pool build

on:
  workflow_dispatch:
  push:
    branches:
      - miru-h40-wave31-ion-boost-pool-ci-trigger
    paths:
      - '.github/workflows/miru-stage9ab-task-sched-info-a14-ci.yml'

permissions:
  contents: read

concurrency:
  group: miru-h40-wave31-ion-boost-pool
  cancel-in-progress: true

jobs:
  build-wave31:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SOURCE_SHA: 52e4ea3db867edd3fb602a6a5a6442ea16901e9e
      MODULES_REPAIR_SHA: 3fe5933901e630913913ffa8614b59502a13a51f
      EXPECTED_RELEASE: 4.14.357-openela-miru-h40-wave31-ion-boost-pool-ci1+
      PACKAGE_TAG: miru-v3-modules-dropin-4.14.357-openela-miru-h40-wave31-ion-boost-pool-ci1

    steps:
      - name: Checkout Wave 31 ION boost pool source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          fetch-depth: 1

      - name: Prepare H.40 config
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          cp h40-repro/config/GM1911_11_H.40.config "${RUNNER_TEMP}/wave31.config"
          bash scripts/miru/configure_mem_stage4.sh "${RUNNER_TEMP}/wave31.config"

      - name: Generate stable 4.14.357 build driver
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('source/scripts/miru/ci_build_4.14.190.sh')
          target = Path('build-wave31-stable.sh')
          text = source.read_text()

          start = text.index('# Fetch only the distant commits required by the source-level sanity checks.')
          end = text.index("# GitHub's Ubuntu image contains most dependencies already")
          gate = '''# Minimal immutable-input gate; compilation is authoritative.
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test -z "$(git ls-files -u)"
          {
            echo "input=PASS"
            echo "head=${SOURCE_SHA}"
            echo "kernel_version=4.14.357-openela"
          } | tee "${DIAG_DIR}/sanity-summary.txt"

          '''
          text = text[:start] + gate + text[end:]

          final = '\n'.join([
              'release="$(cat "${OUT_DIR}/include/config/kernel.release")"',
              'test "${release}" = "${EXPECTED_RELEASE}"',
              'cp "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" "${ARTIFACT_DIR}/${EXPECTED_RELEASE}-Image.gz-dtb"',
              'printf \'%s\\n\' "${EXPECTED_RELEASE}" > "${ARTIFACT_DIR}/KERNEL-RELEASE.txt"',
              'printf \'%s\\n\' "${SOURCE_SHA}" > "${ARTIFACT_DIR}/SOURCE-SHA.txt"',
              'printf \'%s\\n\' "${MODULES_REPAIR_SHA}" > "${ARTIFACT_DIR}/VENDOR-SHA.txt"',
              'sha256sum "${ARTIFACT_DIR}/${EXPECTED_RELEASE}-Image.gz-dtb" > "${ARTIFACT_DIR}/WAVE31-ION-BOOST-POOL-IMAGE-SHA256.txt"',
              'echo "Wave 31 ION boost pool kernel build: PASS"',
          ])

          replacements = {
              'VENDOR_SHA=a21f9352e70a8685556582465309f8eb3fe401cb':
                  'VENDOR_SHA=3fe5933901e630913913ffa8614b59502a13a51f',
              '== Miru H.40 Android 4.14.190 CI build ==':
                  '== Miru H.40 Wave 31 ION boost pool stable build ==',
              'KERNEL_LOCALVERSION=-miru-h40-lts190-ci1':
                  'KERNEL_LOCALVERSION=-miru-h40-wave31-ion-boost-pool-ci1',
              'CONFIG_LOCALVERSION="-miru-h40-lts190-ci1"':
                  'CONFIG_LOCALVERSION="-miru-h40-wave31-ion-boost-pool-ci1"',
              'export SKIP_PRODUCTION_DTS=1':
                  'export SKIP_PRODUCTION_DTS=0',
              "banner=\"$(strings \"${OUT_DIR}/arch/arm64/boot/Image\" | grep -m1 '^Linux version 4\\.14\\.190-' || true)\"":
                  "banner=\"$(strings \"${OUT_DIR}/arch/arm64/boot/Image\" | grep -m1 -F 'Linux version 4.14.357-openela-miru-h40-wave31-ion-boost-pool-ci1+' || true)\"",
              'echo "Clean kernel build and output validation: PASS"': final,
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'build setup anchor {old!r}: {text.count(old)}')
              text = text.replace(old, new, 1)

          target.write_text(text)
          target.chmod(0o755)
          PY
          bash -n build-wave31-stable.sh

      - name: Compile kernel and reconstructed H.40 device trees
        shell: bash
        working-directory: source
        env:
          STOCK_CONFIG: ${{ runner.temp }}/wave31.config
        run: |
          set -Eeuo pipefail
          mkdir -p "${RUNNER_TEMP}/miru-dtc"
          curl -fsSL \
            'https://android.googlesource.com/kernel/prebuilts/build-tools/+/e905be252a53d20c52bd9e59df3ff8fdd46b9eab/linux-x86/bin/dtc?format=TEXT' \
            | base64 --decode > "${RUNNER_TEMP}/miru-dtc/dtc"
          curl -fsSL \
            'https://android.googlesource.com/kernel/prebuilts/build-tools/+/e905be252a53d20c52bd9e59df3ff8fdd46b9eab/linux-x86/lib64/libfdt.so?format=TEXT' \
            | base64 --decode > "${RUNNER_TEMP}/miru-dtc/libfdt.so"
          curl -fsSL \
            'https://android.googlesource.com/kernel/prebuilts/build-tools/+/e905be252a53d20c52bd9e59df3ff8fdd46b9eab/linux-x86/lib64/libc++.so?format=TEXT' \
            | base64 --decode > "${RUNNER_TEMP}/miru-dtc/libc++.so"
          chmod +x "${RUNNER_TEMP}/miru-dtc/dtc"
          export LD_LIBRARY_PATH="${RUNNER_TEMP}/miru-dtc${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          export EXTERNAL_DTC="${RUNNER_TEMP}/miru-dtc/dtc"
          bash ../build-wave31-stable.sh

          artifact_dir="${RUNNER_TEMP}/android-root/out/h40-artifacts"
          test -s "${artifact_dir}/arch/arm64/boot/Image.gz-dtb"
          test -s "${artifact_dir}/production-device-trees/h40-dtb.img"
          test -s "${artifact_dir}/production-device-trees/h40-dtbo.img"

      - name: Build and package matching external modules
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          out_dir="${RUNNER_TEMP}/android-root/out/h40-kernel"
          artifact_dir="${RUNNER_TEMP}/android-root/out/h40-artifacts"
          vendor_source="${RUNNER_TEMP}/oneplus-sm8150-vendor-source"
          module_dir="${RUNNER_TEMP}/miru-external-modules/dropin"
          report_dir="${GITHUB_WORKSPACE}/external-module-diagnostics"
          runtime_archive="${RUNNER_TEMP}/android-root/out/${PACKAGE_TAG}.7z"
          audit_archive="${RUNNER_TEMP}/android-root/out/${PACKAGE_TAG}-audit.zip"

          test -s "${out_dir}/Module.symvers"
          test "$(git -C "${vendor_source}" rev-parse HEAD)" = "${MODULES_REPAIR_SHA}"

          python3 scripts/miru/prepare_external_modules_toolchain.py
          python3 scripts/miru/prepare_external_pinctrl_headers.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/miru/prepare_wlan_response_link.py')
          text = path.read_text()
          old = 'expected = "74ce588c69513197a354ef0032c2145e91ee0641"'
          new = 'expected = "ee3b37a3bf6a586b74fe00f9e39ca5e77f08b6d3"'
          if text.count(old) != 1:
              raise SystemExit('WLAN response-link setup anchor changed')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 scripts/miru/prepare_wlan_response_link.py

          python3 - "${EXPECTED_RELEASE}" "${PACKAGE_TAG}" <<'PY'
          from pathlib import Path
          import sys

          path = Path('scripts/miru/build_external_modules_4.14.190.sh')
          release, package_tag = sys.argv[1:]
          text = path.read_text()
          replacements = (
              ('4.14.190-miru-h40-lts190-ci1+', release, 1),
              ('miru-v3-modules-dropin-4.14.190', package_tag, 4),
              ('Miru 4.14.190 rebuilt external module ABI report',
               'Miru Wave 31 ION boost pool external module report', 1),
          )
          for old, new, expected in replacements:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'external build setup anchor {old!r}: {actual}')
              text = text.replace(old, new)

          start = text.index('# Full binary ABI verification:')
          end = text.index('# Generate hashes, a concise manifest, and both runtime and audit archives.')
          text = text[:start] + '# Full binary ABI audit intentionally omitted from the build gate.\n' + text[end:]
          path.write_text(text)
          PY

          sudo apt-get install -y --no-install-recommends p7zip-full
          bash scripts/miru/build_external_modules_4.14.190.sh

          test "$(find "${module_dir}" -maxdepth 1 -type f -name '*.ko' | wc -l)" = 32
          test -s "${runtime_archive}"
          test -s "${audit_archive}"

          mkdir -p "${artifact_dir}/external-modules"
          cp "${runtime_archive}" "${audit_archive}" "${artifact_dir}/external-modules/"
          cp "${report_dir}/BUILD-MANIFEST.txt" \
             "${report_dir}/PACKAGE-SUMMARY.txt" \
             "${report_dir}/vermagic.txt" \
             "${artifact_dir}/external-modules/"

      - name: Upload Wave 31 kernel, device trees, and modules
        uses: actions/upload-artifact@v4
        with:
          name: miru-h40-wave31-ion-boost-pool-kernel-and-modules
          path: ${{ runner.temp }}/android-root/out/h40-artifacts
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
